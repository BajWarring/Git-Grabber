name: gitglance
description: GitHub Repository Explorer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  archive: ^3.5.1
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Optional: download JetBrains Mono from jetbrains.com/lp/mono
  # place the .ttf files in assets/fonts/ and uncomment below:
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/JetBrainsMono-Medium.ttf
  #         weight: 500
