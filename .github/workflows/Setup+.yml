name: 1. Setup Flutter App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name shown on device"
        required: true
        default: "My App"

      package_name:
        description: "Android package name (example: com.example.app)"
        required: true
        default: "com.example.app"

      pubspec_description:
        description: "Description for pubspec.yaml"
        required: true
        default: "A new Flutter project."

permissions:
  contents: write

jobs:
  init-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable

      - name: Derive Project Variables
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          APPNAME="${{ github.event.inputs.app_name }}"
          DESC="${{ github.event.inputs.pubspec_description }}"

          # Extract project name (last segment)
          PROJECT=$(echo $PACKAGE | awk -F. '{print $NF}')

          # Extract organization (everything except last segment)
          ORG=$(echo $PACKAGE | sed "s/\.$PROJECT//")

          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "APPNAME=$APPNAME" >> $GITHUB_ENV
          echo "DESC=$DESC" >> $GITHUB_ENV

      - name: Create Flutter Project
        run: |
          flutter create --org $ORG --project-name $PROJECT .

          # Remove default test to keep repo clean
          rm -rf test/widget_test.dart

      - name: Configure App Name
        run: |
          # Update Android launcher label
          sed -i "s/android:label=\".*\"/android:label=\"$APPNAME\"/g" android/app/src/main/AndroidManifest.xml

          # Update strings.xml launcher name
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APPNAME<\/string>/g" android/app/src/main/res/values/strings.xml

      - name: Update Pubspec Description
        run: |
          sed -i "s/^description:.*/description: $DESC/g" pubspec.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add .
          git commit -m "Initialize $APPNAME ($PACKAGE)"
          git push
